<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Vestify</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0d0415',
                        brandCard: '#160826',
                        brandCardBorder: '#2e144d',
                        brandOrange: '#f97316',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-brandCard border border-brandCardBorder rounded-3xl p-6 sm:p-8 shadow-2xl my-6">
        
        <!-- Logo & Brand Header -->
        <div class="flex items-center justify-center space-x-3 mb-6">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/20 p-2">
                <img src="IMG_20260815_134639_986-removebg-preview.png" alt="Vestify Logo" class="w-full h-full object-contain">
            </div>
            <span class="text-2xl font-bold tracking-wide text-white">Vestify</span>
        </div>

        <!-- Headings -->
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">Create your account</h1>
            <p class="text-gray-400 text-sm">Fill in your details to get started on Vestify.</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" class="space-y-5" onsubmit="handleRegistration(event)">
            
            <!-- Full Name -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-gray-300 uppercase mb-2">Full Name</label>
                <input type="text" id="fullName" required placeholder="e.g. John Doe" 
                    class="w-full bg-[#1e0b36] border border-brandCardBorder rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            </div>

            <!-- Username -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-gray-300 uppercase mb-2">Username</label>
                <input type="text" id="username" required placeholder="@username" 
                    class="w-full bg-[#1e0b36] border border-brandCardBorder rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            </div>

            <!-- Email Address -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-gray-300 uppercase mb-2">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com" 
                    class="w-full bg-[#1e0b36] border border-brandCardBorder rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-gray-300 uppercase mb-2">Phone Number</label>
                <input type="tel" id="phone" required placeholder="08012345678" 
                    class="w-full bg-[#1e0b36] border border-brandCardBorder rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-gray-300 uppercase mb-2">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters" 
                    class="w-full bg-[#1e0b36] border border-brandCardBorder rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full mt-2 bg-gradient-to-r from-amber-500 via-orange-500 to-pink-600 hover:opacity-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center space-x-2 text-sm">
                <span id="btnText">Continue to Payment →</span>
                <svg id="spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

    <!-- Script to handle registration, local storage save, email trigger simulation, and redirection -->
    <script>
        function handleRegistration(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            // Save user data locally so payment.html or backend files can access it
            const userData = { fullName, username, email, phone, password };
            localStorage.setItem('vestifyUser', JSON.stringify(userData));

            // UI loading state
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const submitBtn = document.getElementById('submitBtn');

            btnText.textContent = "Processing & Sending Email...";
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;

            // Simulate Email Dispatch Action (If handling backend via PHP/API, replace this block with fetch)
            setTimeout(() => {
                console.log(`Welcome email triggered successfully to: ${email}`);
                
                // Redirect to payment page
                window.location.href = "payment.html";
            }, 1200);
        }
    </script>
</body>
</html>
